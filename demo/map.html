<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halden office map</title>
  <style>
    html,body{margin:0;height:100%}
    body{position:relative;overflow:hidden;font:13px/1.4 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#14171c;
      background:#e8eae3 linear-gradient(90deg,transparent 47%,#fff 47%,#fff 53%,transparent 53%) 0 0/120px 120px,linear-gradient(0deg,#e8eae3 46%,#fff 46%,#fff 54%,#e8eae3 54%) 0 0/120px 120px}
    .river{position:absolute;left:-10%;top:58%;width:120%;height:34px;background:#a9cbe0;transform:rotate(-8deg)}
    .pin{position:absolute;left:50%;top:44%;width:22px;height:22px;margin:-22px 0 0 -11px;border-radius:50% 50% 50% 0;background:#d4483b;transform:rotate(-45deg)}
    .card{position:absolute;left:10px;top:10px;padding:8px 10px;border-radius:4px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
    .card strong{display:block}
  </style>
</head>
<body>
  <div class="river"></div><div class="pin"></div>
  <div class="card"><strong>Halden HQ</strong>2-1 Kyobashi, Chuo-ku, Tokyo</div>
</body>
</html>
