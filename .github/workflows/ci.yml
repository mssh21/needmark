name: CI

on:
  push:
    branches: [main]
    # Nothing the checks build or test reads these files, so a change limited to them skips CI.
    paths-ignore: &non-code
      - '**/*.md'
      - site/**
      - .github/workflows/pages.yml
      - LICENSE
  pull_request:
    paths-ignore: *non-code

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  vite7:
    name: Vite 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The peer range still accepts Vite 7 while the lockfile pins Vite 8, so this job swaps in Vite 7 and the plugin-react major that supports it.
      - run: pnpm add -Dw vite@7.3.7 @vitejs/plugin-react@5.2.0
      - run: pnpm build
      - run: pnpm test src/index.test.ts

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image ships the browsers and their OS packages, so no apt mirror is hit at run time; src/ci.test.ts keeps its tag on the locked Playwright version.
    # --user 1001 matches the runner's workspace owner, and Chromium needs --ipc=host to avoid running out of shared memory.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Chromium runs headed for the native tab-picker tests, so it needs a virtual display.
      - run: xvfb-run --auto-servernum pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
