name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already on npm
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "needmark@$version" version > /dev/null 2>&1; then
            echo "needmark@$version is already published; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: pnpm build
      - if: steps.version.outputs.publish == 'true'
        run: pnpm typecheck
      - if: steps.version.outputs.publish == 'true'
        run: pnpm test
      # setup-node's .npmrc reads ${NODE_AUTH_TOKEN}, which trusted publishing never sets, and Yarn 1 aborts on an unset
      # reference; an empty value only satisfies it here, so npm publish still authenticates through OIDC.
      # setup-nodeの.npmrcは信頼された公開では設定されない${NODE_AUTH_TOKEN}を参照し、Yarn 1は未設定の参照で中断する。
      # 空の値はこの手順だけで満たすため、npm publishは引き続きOIDCで認証する。
      - if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ''
        run: pnpm test:package-managers
      - if: steps.version.outputs.publish == 'true'
        run: npm publish
      - if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
