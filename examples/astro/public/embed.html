<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embedded widget</title>
  <style>
    body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; background: #fff8e6; }
    button { padding: 6px 12px; }
  </style>
</head>
<body>
  <h3>Same-origin iframe</h3>
  <p>This document is served by the same origin as the page that embeds it.</p>
  <button type="button" onclick="this.textContent = 'Clicked'">Button inside the iframe</button>
</body>
</html>
